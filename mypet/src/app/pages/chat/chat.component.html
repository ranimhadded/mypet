<div class="layout">
  <app-side-bar></app-side-bar>

  <div class="chat-container">

    <!-- CHAT SIDEBAR -->
    <aside class="chat-sidebar">
      <div class="sidebar-header">
        <h1>Messages</h1>
        <div class="search-box">
          <span class="material-icons-outlined search-icon">search</span>
          <input type="text" placeholder="Search chats..." />
        </div>
      </div>

      <div class="chat-list">
        <div *ngFor="let chat of chatThreads" 
             class="chat-item" 
             [class.active]="chat.chatId === currentChatId"
             (click)="openChat(chat.chatId, chat.receiverId, chat.receiverName, chat.receiverAvatar)">
          <div class="avatar-wrapper">
            <img [src]="chat.receiverAvatar || 'assets/user.png'" [alt]="chat.receiverName" />
            <span class="status online"></span>
          </div>
          <div class="chat-info">
            <div class="chat-header">
              <h3>{{ chat.receiverName }}</h3>
              <span>{{ chat.lastTimestamp | date:'shortTime' }}</span>
            </div>
            <p>{{ chat.lastMessage }}</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- CHAT MAIN -->
    <main class="chat-main">
      <header class="chat-main-header">
        <div class="user-info">
          <div class="avatar-wrapper">
            <img [src]="receiverAvatar" [alt]="receiverName" />
            <span class="status online"></span>
          </div>
          <div>
            <h2>{{ receiverName }}</h2>
            <span class="role">Owner</span>
            <p class="online-status">Online</p>
          </div>
        </div>

        <div class="header-actions">
          <button><span class="material-icons-outlined">phone</span></button>
          <button><span class="material-icons-outlined">videocam</span></button>
          <button><span class="material-icons-outlined">more_vert</span></button>
        </div>
      </header>

      <!-- CHAT MESSAGES -->
      <div class="chat-messages">
        <div class="date-separator">Today</div>

        <div *ngFor="let msg of messages$ | async"
             class="message"
             [ngClass]="{
               sent: msg.senderId === currentUserId,
               received: msg.senderId !== currentUserId
             }">
          <div class="bubble">{{ msg.message }}</div>
          <span class="timestamp">{{ msg.timestamp | date:'shortTime' }}</span>
        </div>
      </div>

      <!-- CHAT FOOTER -->
      <footer class="chat-footer">
        <input type="text" [(ngModel)]="newMessage" placeholder="Type a message..." />
        <button class="send-button" (click)="sendMessage()">
          <span class="material-icons-outlined">send</span>
        </button>
      </footer>
    </main>

  </div>
</div>
