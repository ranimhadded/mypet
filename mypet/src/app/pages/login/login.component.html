<div class="login-page">
  <div class="login-container">
    <div class="login-box">
      <h1>Login</h1>
      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required ngModel />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required ngModel />
        </div>       
<div class="button">
  <button type="submit">Login</button>
  <p class="signup-text">
    Don't have an account? <a class="orange" (click)="goToSignup()">Sign Up</a>
  </p>
</div>

      </form>
    </div>

    <!-- Image floating on top -->
    <div class="login-image">
      <img src="assets/login.png" alt="Dog"/>
    </div>
  </div>
</div>
